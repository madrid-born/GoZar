<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#B85E3C"/></marker><style>text{font-family:Arial,sans-serif;fill:#512D1D}.t{font-size:19px;font-weight:bold}.s{font-size:13px;fill:#79675C}.box{fill:white;stroke:#E6DACE;stroke-width:2}.link{fill:none;stroke:#B85E3C;stroke-width:2;marker-end:url(#arrow)}.tag{font-size:11px;letter-spacing:2px;fill:#B85E3C}</style></defs><rect width="1440" height="990" fill="#FFFCF4"/><text x="60" y="65" font-size="35">Go Zar · The learning journey</text><text x="60" y="95" class="s">Personal relevance chooses new material. Memory scheduling chooses reviews. A stable session brings them together.</text><text x="60" y="145" class="tag">01 / START SOMEWHERE FAMILIAR</text><g transform="translate(60 170)"><rect class="box" width="240" height="100" rx="18"/><text x="20" y="38" class="t">Welcome + city</text><text x="20" y="65" class="s">Guest first · Tehran at launch</text></g><g transform="translate(390 170)"><rect class="box" width="270" height="100" rx="18"/><text x="20" y="38" class="t">Interests + important places</text><text x="20" y="65" class="s">Approximate anchors · optional</text></g><g transform="translate(750 170)"><rect class="box" width="250" height="100" rx="18"/><text x="20" y="38" class="t">Familiarity check</text><text x="20" y="65" class="s">Prior knowledge · optional</text></g><g transform="translate(1100 170)"><rect width="260" height="100" rx="18" fill="#F3E9DD"/><text x="20" y="38" class="t">Today</text><text x="20" y="65" class="s">A short, resumable session</text></g><path class="link" d="M300 220H380M660 220H740M1000 220H1090"/><text x="60" y="340" class="tag">02 / LEARN, RETRIEVE, UNDERSTAND</text><g transform="translate(60 370)"><rect class="box" width="240" height="110" rx="18"/><text x="20" y="38" class="t">Introduce a place</text><text x="20" y="65" class="s">Geometry + familiar reference</text><text x="20" y="86" class="s">Introduction is not mastery</text></g><g transform="translate(390 370)"><rect class="box" width="270" height="110" rx="18"/><text x="20" y="38" class="t">Recognition / locating</text><text x="20" y="65" class="s">Skill-appropriate questions</text><text x="20" y="86" class="s">Submit once · idempotent answer</text></g><g transform="translate(750 370)"><rect class="box" width="250" height="110" rx="18"/><text x="20" y="38" class="t">Explain the answer</text><text x="20" y="65" class="s">Correct: reinforce connection</text><text x="20" y="86" class="s">Incorrect: explain + earlier review</text></g><g transform="translate(1100 370)"><rect width="260" height="110" rx="18" fill="#F3E9DD"/><text x="20" y="38" class="t">Session complete</text><text x="20" y="65" class="s">Introduced + reviewed counts</text><text x="20" y="86" class="s">More practice remains available</text></g><path class="link" d="M1230 270V305H180V360M300 425H380M660 425H740M1000 425H1090"/><text x="60" y="555" class="tag">03 / BUILD A CITY IN YOUR MIND</text><g transform="translate(60 585)"><rect class="box" width="300" height="115" rx="18"/><text x="20" y="38" class="t">Growing map + place details</text><text x="20" y="65" class="s">Faint context · introduced / remembered</text><text x="20" y="87" class="s">Learned items become useful anchors</text></g><g transform="translate(440 585)"><rect class="box" width="300" height="115" rx="18"/><text x="20" y="38" class="t">Stories + journey exercises</text><text x="20" y="65" class="s">Connections, landmarks and recall</text><text x="20" y="87" class="s">Educational routes, not live navigation</text></g><g transform="translate(820 585)"><rect class="box" width="260" height="115" rx="18"/><text x="20" y="38" class="t">Due reviews</text><text x="20" y="65" class="s">Skill-specific scheduling</text><text x="20" y="87" class="s">Review-only sessions count too</text></g><g transform="translate(1160 585)"><rect class="box" width="200" height="115" rx="18"/><text x="20" y="38" class="t">Return tomorrow</text><text x="20" y="65" class="s">Support the habit</text><text x="20" y="87" class="s">Keep knowledge intact</text></g><path class="link" d="M1230 480V530H210V575M360 640H430M740 640H810M1080 640H1150"/><path class="link" d="M1360 640H1390V140H1230V160"/><rect x="60" y="775" width="1300" height="155" rx="22" fill="#F3E9DD"/><text x="85" y="815" class="t">Support flows across the experience</text><text x="85" y="850" class="s">Offline: cached content + pending answers → reconnect → deduplicated sync</text><text x="85" y="880" class="s">Preferences: daily goal, optional reminders, anchor editing · Account/sync can follow the first useful lesson</text><text x="85" y="907" class="s">Recovery: an interrupted download preserves existing content and progress</text></svg>
